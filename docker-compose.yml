services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cybershield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybershield-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
